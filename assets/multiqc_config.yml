report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/datasync/releases/tag/1.0.0" target="_blank">nf-core/datasync</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/datasync/1.0.0/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-datasync-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-datasync-summary":
    order: -1002

export_plots: false

disable_version_detection: true

custom_content:
  order:
    - samplesheet
    - rclone_exit_codes
    - rclone_checksum_md5
    - rclone_checksum_sha
    - rclone_check

custom_data:
  samplesheet:
    section_name: "Input Samplesheet"
    description: >
      The input samplesheet lists each sample included in the run, the source path to copy, the destination path,
      and the user-provided checksum files used to validate the source data.
    plot_type: "table"
    file_format: "csv"
    headers:
      sample:
        title: Sample ID
      input:
        title: Path to copy
      output_path:
        title: Destination path
      checksum_md5:
        title: MD5 checksum file
      checksum_sha:
        title: Sha256 checksum file

  rclone_exit_codes:
    section_name: "Validation Summary"
    description: >
      This table summarises the exit codes returned by `RCLONE_CHECK` and `RCLONE_CHECKSUM` for each processed sample. Reviewing these exit codes
      can help identify files that were not successfully validated or where unexpected errors occurred during integrity checking
    plot_type: "table"
    file_format: "tsv"
    headers:
      Row:
        title: Row
        hidden: true
      Sample:
        title: Sample ID
        description: "Sample name from the input samplesheet"
      Module:
        title: Module
      Exit code:
        title: Exit Code
        description: "Exit code reported by the corresponding Rclone module for each processed Sample ID"
        cond_formatting_rules:
          success:
            - s_eq: "0 - Success"
          error:
            - s_eq: "1 - Error"
          syntax_error:
            - s_eq: "2 - Syntax or usage error"
          directory_not_found:
            - s_eq: "3 - Directory not found"
          file_not_found:
            - s_eq: "4 - File not found"
          temporary_error:
            - s_eq: "5 - Temporary error"
          less_serious_error:
            - s_eq: "6 - Less serious error"
          fatal_error:
            - s_eq: "7 - Fatal error"
          transfer_limit_exceeded:
            - s_eq: "8 - Transfer limit exceeded"
          no_files_transferred:
            - s_eq: "9 - No files transferred"
          duration_limit_exceeded:
            - s_eq: "10 - Duration limit exceeded"
        cond_formatting_colours:
          - success: "#5cb85c"
          - error: "#d9534f"
          - syntax_error: "#f0ad4e"
          - directory_not_found: "#f0ad4e"
          - file_not_found: "#f0ad4e"
          - temporary_error: "#5bc0de"
          - less_serious_error: "#5bc0de"
          - fatal_error: "#8b0000"
          - transfer_limit_exceeded: "#9370db"
          - no_files_transferred: "#808080"
          - duration_limit_exceeded: "#6f42c1"

  rclone_checksum_md5:
    parent_id: source_path_checksum_validation
    parent_name: "Source checks"
    parent_description: >
      This section compares checksums calculated from files at each source path with the expected checksums supplied by the user
      in the input samplesheet. This confirms source-file integrity before transfer.
    section_name: "MD5 Checksum Validation"
    description: "Comparison of the expected MD5 checksums provided in the samplesheet with the observed MD5 checksums of the file(s) found at the specified source path."
    plot_type: "table"
    file_format: "tsv"
    headers:
      Status:
        title: Result
        description: "= Match; - Missing in source; + Missing in destination; * Mismatch; ! Error"
        cond_formatting_rules:
          match:
            - s_eq: "="
            - s_eq: "Match"
          missing_source:
            - s_eq: "-"
            - s_eq: "Missing in source"
          missing_destination:
            - s_eq: "+"
            - s_eq: "Missing in destination"
          mismatch:
            - s_eq: "*"
            - s_eq: "Mismatch"
          error:
            - s_eq: "!"
            - s_eq: "Error"
        cond_formatting_colours:
          - match: "#5cb85c"
          - missing_source: "#f0ad4e"
          - missing_destination: "#5bc0de"
          - mismatch: "#d9534f"
          - error: "#8b0000"
      File:
        title: File
        description: "File checked by rclone"
      Sample:
        title: Sample
        description: "Sample name from the input samplesheet"
      Priority:
        title: Priority
        hidden: true
    pconfig:
      no_violin: true
      defaultsort:
        - column: Priority
          direction: asc

  rclone_checksum_sha:
    parent_id: source_path_checksum_validation
    parent_name: "Source checks"
    parent_description: >
      This section compares checksums calculated from files at each source path with the expected checksums supplied by the user
      in the input samplesheet. This confirms source-file integrity before transfer.
    section_name: "SHA-256 Checksum Validation"
    description: "Comparison of the expected SHA-256 checksums provided in the samplesheet with the observed SHA-256 checksums of the file(s) found at the specified source path."
    plot_type: "table"
    file_format: "tsv"
    headers:
      Status:
        title: Result
        description: "= Match; - Missing in source; + Missing in destination; * Mismatch; ! Error"
        cond_formatting_rules:
          match:
            - s_eq: "="
            - s_eq: "Match"
          missing_source:
            - s_eq: "-"
            - s_eq: "Missing in source"
          missing_destination:
            - s_eq: "+"
            - s_eq: "Missing in destination"
          mismatch:
            - s_eq: "*"
            - s_eq: "Mismatch"
          error:
            - s_eq: "!"
            - s_eq: "Error"
        cond_formatting_colours:
          - match: "#5cb85c"
          - missing_source: "#f0ad4e"
          - missing_destination: "#5bc0de"
          - mismatch: "#d9534f"
          - error: "#8b0000"
      File:
        title: File
        description: "File checked by rclone"
      Sample:
        title: Sample
        description: "Sample name from the input samplesheet"
      Priority:
        title: Priority
        hidden: true
    pconfig:
      no_violin: true
      defaultsort:
        - column: Priority
          direction: asc

  rclone_check:
    parent_id: file_transfer_integrity_check
    parent_name: "Post-Transfer Checks"
    parent_description: >
      This section compares corresponding files at the source and destination paths after the transfer step to confirm that the
      destination content is complete and unchanged.
    section_name: "Source-Destination Checksum Validation"
    description: "Comparison of the checksums of corresponding file(s) in the source input path and the output destination to confirm data integrity following file transfer."
    plot_type: "table"
    file_format: "tsv"
    headers:
      Status:
        title: Result
        description: "= Match; - Missing in source; + Missing in destination; * Mismatch; ! Error"
        cond_formatting_rules:
          match:
            - s_eq: "="
            - s_eq: "Match"
          missing_source:
            - s_eq: "-"
            - s_eq: "Missing in source"
          missing_destination:
            - s_eq: "+"
            - s_eq: "Missing in destination"
          mismatch:
            - s_eq: "*"
            - s_eq: "Mismatch"
          error:
            - s_eq: "!"
            - s_eq: "Error"
        cond_formatting_colours:
          - match: "#5cb85c"
          - missing_source: "#f0ad4e"
          - missing_destination: "#5bc0de"
          - mismatch: "#d9534f"
          - error: "#8b0000"
      File:
        title: File
        description: "File checked by rclone"
      Sample:
        title: Sample
        description: "Sample name from the input samplesheet"
      Priority:
        title: Priority
        hidden: true
    pconfig:
      no_violin: true
      defaultsort:
        - column: Priority
          direction: asc

sp:
  samplesheet:
    fn: "samplesheet.csv"
  rclone_exit_codes:
    fn: "rclone_exit_codes.tsv"
  rclone_checksum_md5:
    fn: "*_md5_rclone_checksum_mqc.tsv"
  rclone_checksum_sha:
    fn: "*_sha_rclone_checksum_mqc.tsv"
  rclone_check:
    fn: "*_rclone_check_mqc.tsv"
